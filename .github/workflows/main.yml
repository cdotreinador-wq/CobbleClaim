name: Build CobbleClaim

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar CobbleClaim
        run: gradle build

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClaim
          path: build/libs/*.jar
